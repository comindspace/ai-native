services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway_mcp
      POSTGRES_USER: gateway_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_mcp_dev}
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_mcp -d gateway_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
    command: ["sh", "-c", "gateway-mcp migrate up && gateway-mcp --transport streamable-http"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_TRANSPORT: streamable-http
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      GATEWAY_SERVER_VERSION: ${GATEWAY_SERVER_VERSION:-0.1.0}
      GATEWAY_RELEASE_SHA: ${GATEWAY_RELEASE_SHA:-dev}
      GATEWAY_STATELESS_LEGACY_HTTP: ${GATEWAY_STATELESS_LEGACY_HTTP:-true}
      GATEWAY_MAX_REQUEST_BODY_BYTES: ${GATEWAY_MAX_REQUEST_BODY_BYTES:-4194304}
      GATEWAY_MCP_CATALOG_TTL_MS: ${GATEWAY_MCP_CATALOG_TTL_MS:-300000}
      GATEWAY_CIMD_ENABLED: ${GATEWAY_CIMD_ENABLED:-false}
      GATEWAY_CIMD_ALLOWED_HOSTS: ${GATEWAY_CIMD_ALLOWED_HOSTS:-}
      GATEWAY_OAUTH_ALLOWED_CUSTOM_SCHEMES: ${GATEWAY_OAUTH_ALLOWED_CUSTOM_SCHEMES:-}
      GATEWAY_IDEMPOTENCY_TTL_SECONDS: ${GATEWAY_IDEMPOTENCY_TTL_SECONDS:-86400}
      GATEWAY_MANAGED_CONNECTION_CACHE_SECONDS: ${GATEWAY_MANAGED_CONNECTION_CACHE_SECONDS:-5}
      GATEWAY_FILE_TRANSFER_DIR: ${GATEWAY_FILE_TRANSFER_DIR:-/data/gateway/files}
      GATEWAY_FILE_TRANSFER_MAX_BYTES: ${GATEWAY_FILE_TRANSFER_MAX_BYTES:-104857600}
      GATEWAY_FILE_UPLOAD_TTL_SECONDS: ${GATEWAY_FILE_UPLOAD_TTL_SECONDS:-3600}
      GATEWAY_FILE_DOWNLOAD_TTL_SECONDS: ${GATEWAY_FILE_DOWNLOAD_TTL_SECONDS:-300}
      GATEWAY_PRIVACY_POLICY: ${GATEWAY_PRIVACY_POLICY:-standard}
      GATEWAY_PRIVACY_HMAC_SECRET: ${GATEWAY_PRIVACY_HMAC_SECRET:-}
      GATEWAY_PRIVACY_TERMS_FILE: ${GATEWAY_PRIVACY_TERMS_FILE:-}
      GATEWAY_LLM_PROXY_MAX_BODY_BYTES: ${GATEWAY_LLM_PROXY_MAX_BODY_BYTES:-4194304}
      GATEWAY_LLM_PROXY_TIMEOUT_SECONDS: ${GATEWAY_LLM_PROXY_TIMEOUT_SECONDS:-180}
      GATEWAY_LLM_ALLOW_INSECURE_UPSTREAM: ${GATEWAY_LLM_ALLOW_INSECURE_UPSTREAM:-false}
      GATEWAY_LLM_UPSTREAM_URL: ${GATEWAY_LLM_UPSTREAM_URL:-}
      GATEWAY_LLM_UPSTREAM_API_KEY: ${GATEWAY_LLM_UPSTREAM_API_KEY:-}
      GATEWAY_LLM_DEFAULT_MODEL: ${GATEWAY_LLM_DEFAULT_MODEL:-}
      GATEWAY_LLM_ALLOWED_MODELS: ${GATEWAY_LLM_ALLOWED_MODELS:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8000}
      GATEWAY_ISSUER_URL: ${GATEWAY_ISSUER_URL:-http://localhost:8000}
      GATEWAY_RESOURCE_URL: ${GATEWAY_RESOURCE_URL:-http://localhost:8000/mcp}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?set GATEWAY_JWT_SECRET}
      GATEWAY_TOKEN_TTL_SECONDS: ${GATEWAY_TOKEN_TTL_SECONDS:-31536000}
      GATEWAY_REFRESH_TOKEN_TTL_SECONDS: ${GATEWAY_REFRESH_TOKEN_TTL_SECONDS:-31536000}
      GATEWAY_WEB_PUSH_VAPID_PUBLIC_KEY: ${GATEWAY_WEB_PUSH_VAPID_PUBLIC_KEY:-}
      GATEWAY_USER_TOKEN_ENCRYPTION_KEY: ${GATEWAY_USER_TOKEN_ENCRYPTION_KEY:-}
      GATEWAY_DATABASE_URL: postgresql://gateway_mcp:${POSTGRES_PASSWORD:-gateway_mcp_dev}@postgres:5432/gateway_mcp
      GATEWAY_TOOLS_FILE: ${GATEWAY_TOOLS_FILE:-/app/gateway-tools.json}
      GATEWAY_POLICY_FILE: ${GATEWAY_POLICY_FILE:-/app/gateway-policy.json}
      GATEWAY_FACTORY_PROJECTS_FILE: ${GATEWAY_FACTORY_PROJECTS_FILE:-/app/gateway-factory-projects.json}
      GATEWAY_FACTORY_GIT_ENABLED: ${GATEWAY_FACTORY_GIT_ENABLED:-false}
      GATEWAY_ALLOWED_EMAIL_DOMAINS: ${GATEWAY_ALLOWED_EMAIL_DOMAINS:-}
      GATEWAY_RESOURCE_POLICY_MODE: ${GATEWAY_RESOURCE_POLICY_MODE:-permissive}
      GATEWAY_ALLOW_SERVER_YANDEX_TOKENS: ${GATEWAY_ALLOW_SERVER_YANDEX_TOKENS:-false}
      GATEWAY_ALLOW_SERVER_GITLAB_TOKEN: ${GATEWAY_ALLOW_SERVER_GITLAB_TOKEN:-false}
      GATEWAY_MEMORY_SHORT_TTL_DAYS: ${GATEWAY_MEMORY_SHORT_TTL_DAYS:-7}
      GATEWAY_MEMORY_MEDIUM_TTL_DAYS: ${GATEWAY_MEMORY_MEDIUM_TTL_DAYS:-90}
      GATEWAY_MEMORY_MAX_TTL_DAYS: ${GATEWAY_MEMORY_MAX_TTL_DAYS:-365}
      GATEWAY_MEMORY_SOURCE_DIRS: ${GATEWAY_MEMORY_SOURCE_DIRS:-docs;templates;adr;ADRs}
      GATEWAY_KNOWLEDGE_VAULT_PATH: ${GATEWAY_KNOWLEDGE_VAULT_PATH:-/data/company-knowledge-vault}
      GATEWAY_KNOWLEDGE_INGEST_DIRS: ${GATEWAY_KNOWLEDGE_INGEST_DIRS:-}
      GATEWAY_KNOWLEDGE_INGEST_MAX_BYTES: ${GATEWAY_KNOWLEDGE_INGEST_MAX_BYTES:-1048576}
      GATEWAY_KNOWLEDGE_HISTORY_LIMIT: ${GATEWAY_KNOWLEDGE_HISTORY_LIMIT:-50}
      GATEWAY_OBSIDIAN_ENABLED: ${GATEWAY_OBSIDIAN_ENABLED:-false}
      GATEWAY_OBSIDIAN_VAULT_PATH: ${GATEWAY_OBSIDIAN_VAULT_PATH:-}
      GATEWAY_OBSIDIAN_VAULT_DIRS: ${GATEWAY_OBSIDIAN_VAULT_DIRS:-}
      GATEWAY_OBSIDIAN_VAULT_NAME: ${GATEWAY_OBSIDIAN_VAULT_NAME:-company-knowledge-vault}
      GATEWAY_OBSIDIAN_BASE_URL: ${GATEWAY_OBSIDIAN_BASE_URL:-}
      GATEWAY_COMPANY_INDEXES_FILE: ${GATEWAY_COMPANY_INDEXES_FILE:-/app/gateway-company-indexes.json}
      GATEWAY_COMPANY_YONOTE_INDEX_ID: ${GATEWAY_COMPANY_YONOTE_INDEX_ID:-}
      GATEWAY_COMPANY_YONOTE_INDEX_QUERY: ${GATEWAY_COMPANY_YONOTE_INDEX_QUERY:-Company Context Index}
      GATEWAY_COMPANY_PEOPLE_INDEX_ID: ${GATEWAY_COMPANY_PEOPLE_INDEX_ID:-}
      GATEWAY_COMPANY_PROJECTS_INDEX_ID: ${GATEWAY_COMPANY_PROJECTS_INDEX_ID:-}
      GATEWAY_COMPANY_PROCESSES_INDEX_ID: ${GATEWAY_COMPANY_PROCESSES_INDEX_ID:-}
      GATEWAY_COMPANY_DOCUMENTS_INDEX_ID: ${GATEWAY_COMPANY_DOCUMENTS_INDEX_ID:-}
      GATEWAY_COMPANY_DECISIONS_INDEX_ID: ${GATEWAY_COMPANY_DECISIONS_INDEX_ID:-}
      GATEWAY_COMPANY_OPERATIONS_INDEX_ID: ${GATEWAY_COMPANY_OPERATIONS_INDEX_ID:-}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:?set YANDEX_OAUTH_CLIENT_ID}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:?set YANDEX_OAUTH_CLIENT_SECRET}
      YANDEX_OAUTH_SCOPES: ${YANDEX_OAUTH_SCOPES:-}
      YANDEX_DISK_OAUTH_CLIENT_ID: ${YANDEX_DISK_OAUTH_CLIENT_ID:-}
      YANDEX_DISK_OAUTH_CLIENT_SECRET: ${YANDEX_DISK_OAUTH_CLIENT_SECRET:-}
      YANDEX_DISK_OAUTH_SCOPES: ${YANDEX_DISK_OAUTH_SCOPES:-cloud_api:disk.read cloud_api:disk.write cloud_api:disk.info}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-openid email profile https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/documents}
      YANDEX_OAUTH_ACCESS_TOKEN: ${YANDEX_OAUTH_ACCESS_TOKEN:-}
      YANDEX_MAIL_IMAP_HOST: ${YANDEX_MAIL_IMAP_HOST:-imap.yandex.com}
      YANDEX_MAIL_IMAP_PORT: ${YANDEX_MAIL_IMAP_PORT:-993}
      YANDEX_MAIL_SMTP_HOST: ${YANDEX_MAIL_SMTP_HOST:-smtp.yandex.com}
      YANDEX_MAIL_SMTP_PORT: ${YANDEX_MAIL_SMTP_PORT:-465}
      YONOTE_API_KEY: ${YONOTE_API_KEY:-}
      YONOTE_BASE_URL: ${YONOTE_BASE_URL:-https://wiki.example.com}
      TRACKER_IAM_TOKEN: ${TRACKER_IAM_TOKEN:-}
      TRACKER_ORG_ID: ${TRACKER_ORG_ID:-}
      TRACKER_CLOUD_ORG_ID: ${TRACKER_CLOUD_ORG_ID:-}
      TRACKER_API_BASE_URL: ${TRACKER_API_BASE_URL:-https://api.tracker.yandex.net}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_API_BASE_URL: ${GITLAB_API_BASE_URL:-https://gitlab.example.com/api/v4}
      YANDEX_DISK_API_BASE_URL: ${YANDEX_DISK_API_BASE_URL:-https://cloud-api.yandex.net/v1/disk}
      GOOGLE_DRIVE_API_BASE_URL: ${GOOGLE_DRIVE_API_BASE_URL:-https://www.googleapis.com/drive/v3}
      GOOGLE_DOCS_API_BASE_URL: ${GOOGLE_DOCS_API_BASE_URL:-https://docs.googleapis.com/v1}
      GOOGLE_SHEETS_API_BASE_URL: ${GOOGLE_SHEETS_API_BASE_URL:-https://sheets.googleapis.com/v4/spreadsheets}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TRANSCRIBE_MODEL: ${OPENROUTER_TRANSCRIBE_MODEL:-}
      OPENROUTER_ALLOWED_AUDIO_DIRS: ${OPENROUTER_ALLOWED_AUDIO_DIRS:-}
      OPENROUTER_MAX_AUDIO_SIZE_MB: ${OPENROUTER_MAX_AUDIO_SIZE_MB:-10}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GATEWAY_COMIND_CHAT_ID: ${GATEWAY_COMIND_CHAT_ID:-}
      GATEWAY_COMIND_MR_REVIEW_CHAT_ID: ${GATEWAY_COMIND_MR_REVIEW_CHAT_ID:-}
      CALDAV_URL: ${CALDAV_URL:-https://caldav.yandex.ru}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ${GATEWAY_INFRA_SSH_SECRETS_HOST:-/opt/agent-dev-factory/secrets/ssh}:/gateway-secrets/ssh:ro
      - ${GATEWAY_KNOWLEDGE_VAULT_HOST:-/opt/gateway-mcp/company-knowledge-vault}:/data/company-knowledge-vault
      - ${GATEWAY_OBSIDIAN_VAULT_HOST:-/opt/gateway-mcp/obsidian-vault}:/data/obsidian-vault:ro
      - gateway-files:/data/gateway/files
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz')); raise SystemExit(0 if data.get('ok') else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-worker:
    build:
      context: .
    command: ["gateway-mcp", "notifications-worker"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_DATABASE_URL: postgresql://gateway_mcp:${POSTGRES_PASSWORD:-gateway_mcp_dev}@postgres:5432/gateway_mcp
      GATEWAY_WEB_PUSH_VAPID_PRIVATE_KEY: ${GATEWAY_WEB_PUSH_VAPID_PRIVATE_KEY:-}
      GATEWAY_WEB_PUSH_VAPID_SUBJECT: ${GATEWAY_WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
      GATEWAY_NOTIFICATION_POLL_SECONDS: ${GATEWAY_NOTIFICATION_POLL_SECONDS:-2}
      GATEWAY_NOTIFICATION_BATCH_SIZE: ${GATEWAY_NOTIFICATION_BATCH_SIZE:-25}
      GATEWAY_NOTIFICATION_MAX_ATTEMPTS: ${GATEWAY_NOTIFICATION_MAX_ATTEMPTS:-8}
      GATEWAY_WEB_PUSH_TIMEOUT_SECONDS: ${GATEWAY_WEB_PUSH_TIMEOUT_SECONDS:-10}

volumes:
  gateway-postgres:
  gateway-files:
