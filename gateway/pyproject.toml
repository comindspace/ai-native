[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-mcp"
version = "0.1.0"
description = "Gateway MCP boundless for agent skills and private MCP routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "caldav>=1.3.7",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.27,<2",
    "prometheus-client>=0.20.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT>=2.8.0",
    "python-socks[asyncio]>=2.4.0",
    "pywebpush>=2.5.0,<3",
    "telethon>=1.41.0",
    "uvicorn>=0.30.0"
]

[tool.setuptools]
py-modules = ["gateway", "gateway_access", "gateway_auth", "gateway_backends", "gateway_company", "gateway_memory", "gateway_migrations", "gateway_observability", "gateway_policy", "gateway_storage"]
packages = ["gateway_mcp", "gateway_mcp.backends", "gateway_mcp.routes", "gateway_mcp.services", "gateway_mcp.tools"]
include-package-data = true

[tool.setuptools.data-files]
"migrations" = ["migrations/*.sql"]
"." = ["gateway-tools.json", "gateway-policy.json", "gateway-company-indexes.json", "gateway-factory-projects.json"]

[project.scripts]
gateway-mcp = "gateway:main"
